<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="fr-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#041423"/>
      <stop offset=".55" stop-color="#0A4C61"/>
      <stop offset="1" stop-color="#12808F"/>
    </linearGradient>
    <linearGradient id="fr-ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4F5F8"/>
      <stop offset=".5" stop-color="#93C9D8"/>
      <stop offset="1" stop-color="#2A6E84"/>
    </linearGradient>
    <linearGradient id="fr-aurora" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FD6E6" stop-opacity="0"/>
      <stop offset=".5" stop-color="#8FE4C9" stop-opacity=".55"/>
      <stop offset="1" stop-color="#B49BE8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="fr-moon" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F2FAFB" stop-opacity=".85"/>
      <stop offset="1" stop-color="#F2FAFB" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#fr-sky)"/>

  <!-- aurora -->
  <g>
    <path d="M140 0C200 150 150 280 230 390 310 280 270 140 360 0Z" fill="url(#fr-aurora)"/>
    <path d="M420 0C500 170 440 320 540 450 640 320 590 150 690 0Z" fill="url(#fr-aurora)" opacity=".75"/>
    <path d="M760 0C840 140 800 270 880 380 960 260 930 130 1020 0Z" fill="url(#fr-aurora)" opacity=".6"/>
  </g>

  <!-- moon -->
  <circle cx="920" cy="140" r="150" fill="url(#fr-moon)"/>
  <circle cx="920" cy="140" r="46" fill="#EFF8F9" opacity=".85"/>

  <!-- far range -->
  <path d="M0 500 110 400 210 490 330 380 450 490 570 390 690 500 810 380 940 490 1070 400 1200 480V780H0Z" fill="#0B3A4E"/>
  <g fill="url(#fr-ice)" opacity=".9">
    <path d="M330 380 354 410 338 418 326 408 312 420 298 412Z"/>
    <path d="M810 380 834 410 818 418 806 408 792 420 778 412Z"/>
  </g>

  <!-- ice spires -->
  <path d="M120 760 190 380 260 760Z" fill="#1A5570"/>
  <path d="M190 380 208 760 260 760Z" fill="url(#fr-ice)" opacity=".6"/>
  <path d="M380 760 470 320 560 760Z" fill="#1A5570"/>
  <path d="M470 320 496 760 560 760Z" fill="url(#fr-ice)" opacity=".65"/>
  <path d="M700 760 770 430 840 760Z" fill="#1A5570"/>
  <path d="M770 430 788 760 840 760Z" fill="url(#fr-ice)" opacity=".55"/>
  <path d="M960 760 1040 360 1120 760Z" fill="#1A5570"/>
  <path d="M1040 360 1064 760 1120 760Z" fill="url(#fr-ice)" opacity=".6"/>

  <!-- frozen lake -->
  <path d="M0 760V660C200 640 400 664 600 650 820 634 1000 662 1200 646V760Z" fill="#0D3A4E"/>
  <g stroke="#9FE0EC" stroke-width="1.6" opacity=".4">
    <path d="M100 700h220"/><path d="M420 716h200"/><path d="M720 694h240"/><path d="M960 720h180"/>
  </g>
  <!-- reflections -->
  <g fill="#EAFBFF" opacity=".25">
    <path d="M186 660 190 760 176 760Z"/>
    <path d="M466 660 470 760 452 760Z"/>
    <path d="M1036 660 1040 760 1020 760Z"/>
  </g>

  <!-- submerged cathedral silhouette -->
  <g fill="#07222F" opacity=".9">
    <path d="M560 660V600h90v60Z"/>
    <path d="M572 600 605 552 638 600Z"/>
    <path d="M605 552V534"/>
    <path d="M660 660V616h44v44Z"/>
    <path d="M666 616 682 588 698 616Z"/>
  </g>

  <!-- snow -->
  <g fill="#EAFBFF">
    <circle cx="200" cy="160" r="1.8" opacity=".7"/><circle cx="380" cy="260" r="1.4" opacity=".6"/>
    <circle cx="620" cy="140" r="1.7" opacity=".65"/><circle cx="840" cy="300" r="1.3" opacity=".5"/>
    <circle cx="1080" cy="200" r="1.8" opacity=".6"/><circle cx="1140" cy="440" r="1.4" opacity=".5"/>
    <circle cx="80" cy="380" r="1.4" opacity=".5"/><circle cx="520" cy="420" r="1.2" opacity=".45"/>
  </g>

  <!-- mist -->
  <path d="M0 760V600C220 584 440 610 660 596 900 580 1060 606 1200 592V760Z" fill="#0E4C62" opacity=".4"/>
</svg>
