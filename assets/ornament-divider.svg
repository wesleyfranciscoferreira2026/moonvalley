<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 48" fill="none">
  <defs>
    <linearGradient id="orn-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D8D8CF" stop-opacity="0"/>
      <stop offset=".45" stop-color="#D8D8CF" stop-opacity=".85"/>
      <stop offset="1" stop-color="#D8D8CF" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="orn-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD9A3"/>
      <stop offset="1" stop-color="#B85C43"/>
    </linearGradient>
    <linearGradient id="orn-silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#96A0A5"/>
    </linearGradient>
  </defs>

  <!-- main lines -->
  <path d="M14 24H226" stroke="url(#orn-line)" stroke-width="1.1"/>
  <path d="M546 24H334" stroke="url(#orn-line)" stroke-width="1.1"/>
  <path d="M40 18.5H210" stroke="url(#orn-line)" stroke-width=".5" opacity=".5"/>
  <path d="M520 18.5H350" stroke="url(#orn-line)" stroke-width=".5" opacity=".5"/>
  <path d="M40 29.5H210" stroke="url(#orn-line)" stroke-width=".5" opacity=".5"/>
  <path d="M520 29.5H350" stroke="url(#orn-line)" stroke-width=".5" opacity=".5"/>

  <!-- left filigree (mirrored on the right) -->
  <g id="orn-half" stroke="#D8D8CF" stroke-width="1.1" opacity=".9">
    <path d="M226 24C244 24 252 12 268 12"/>
    <path d="M226 24C244 24 252 36 268 36"/>
    <path d="M268 12C280 12 284 18 292 20"/>
    <path d="M268 36C280 36 284 30 292 28"/>
  </g>
  <g transform="translate(560,0) scale(-1,1)">
    <use href="#orn-half"/>
  </g>

  <!-- end diamonds -->
  <path d="M14 24 20 20.5 26 24 20 27.5Z" fill="url(#orn-gold)"/>
  <path d="M546 24 540 20.5 534 24 540 27.5Z" fill="url(#orn-gold)"/>

  <!-- side diamonds -->
  <path d="M300 24 305 20.9 310 24 305 27.1Z" fill="url(#orn-silver)"/>
  <path d="M260 24 265 20.9 270 24 265 27.1Z" fill="url(#orn-silver)"/>

  <!-- center: crescent + gem -->
  <path d="M286.5 8A16 16 0 1 0 286.5 40A13 13 0 1 1 286.5 8Z" fill="url(#orn-silver)" transform="rotate(-90 280 24)"/>
  <path d="M280 18 284.5 24 280 30 275.5 24Z" fill="url(#orn-gold)"/>
  <circle cx="280" cy="24" r="1.6" fill="#FFF3DF"/>
</svg>
