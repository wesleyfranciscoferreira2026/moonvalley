  <!-- bright cross-stars -->
  <g stroke="#FFFFFF" stroke-width="1" opacity=".7">
    <path d="M520 108v24M508 120h24"/>
    <path d="M1500 98v22M1489 109h22"/>
  </g>
  <g stroke="#BFE6EE" stroke-width="1" opacity=".5">
    <path d="M120 78v18M111 87h18"/>
