  </g>

  <!-- drifting clouds -->
  <g fill="#0A3145" opacity=".45">
    <path d="M0 560C180 520 320 560 480 540 700 512 860 552 1060 534 1260 516 1440 550 1600 528V640H0Z"/>
  </g>
  <g fill="#0D3E55" opacity=".35">
