<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="mt-haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15586F"/>
      <stop offset="1" stop-color="#0C3A4C"/>
    </linearGradient>
    <linearGradient id="mt-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B3145"/>
      <stop offset="1" stop-color="#071E2C"/>
    </linearGradient>
    <linearGradient id="mt-near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07222F"/>
      <stop offset="1" stop-color="#04121C"/>
    </linearGradient>
    <linearGradient id="mt-snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4EDE2"/>
      <stop offset=".5" stop-color="#CBD9DC"/>
      <stop offset="1" stop-color="#7E97A0"/>
    </linearGradient>
    <linearGradient id="mt-snow-warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE3B8"/>
      <stop offset="1" stop-color="#B98A54"/>
    </linearGradient>
  </defs>

  <!-- farthest hazy range -->
  <g opacity=".85">
    <path d="M-20 640 120 520 210 590 330 470 430 560 560 430 660 540 780 460 900 560 1030 450 1140 560 1260 490 1400 580 1520 500 1620 600V920H-20Z" fill="url(#mt-haze)"/>
    <!-- snow caps, cool side -->
    <path d="M330 470 360 500 345 505 330 495 315 508 300 500Z" fill="url(#mt-snow)" opacity=".9"/>
    <path d="M560 430 596 470 578 478 560 466 542 480 524 470Z" fill="url(#mt-snow)" opacity=".9"/>
    <path d="M780 460 810 494 795 500 780 490 766 502 750 494Z" fill="url(#mt-snow)" opacity=".85"/>
    <!-- snow caps, warm side (right, lit by the golden sun) -->
    <path d="M1030 450 1064 488 1048 496 1030 484 1014 498 996 488Z" fill="url(#mt-snow-warm)"/>
    <path d="M1260 490 1288 520 1275 526 1260 518 1246 528 1232 520Z" fill="url(#mt-snow-warm)" opacity=".95"/>
    <path d="M1520 500 1546 528 1534 534 1520 527 1507 536 1494 528Z" fill="url(#mt-snow-warm)" opacity=".9"/>
  </g>

  <!-- mid range -->
  <path d="M-20 760 130 640 240 720 380 600 500 700 640 580 760 690 900 600 1040 700 1180 610 1320 710 1460 630 1620 730V920H-20Z" fill="url(#mt-mid)"/>
  <path d="M380 600 408 632 392 640 378 630 362 642 348 634Z" fill="url(#mt-snow)" opacity=".8"/>
  <path d="M640 580 672 616 655 624 638 613 622 626 606 616Z" fill="url(#mt-snow)" opacity=".8"/>
  <path d="M1180 610 1210 644 1194 652 1179 643 1164 654 1150 644Z" fill="url(#mt-snow-warm)" opacity=".9"/>

  <!-- near range, darkest -->
  <path d="M-20 900 60 810 200 880 340 800 470 890 620 810 780 900 940 820 1100 900 1260 830 1420 900 1620 840V940H-20Z" fill="url(#mt-near)"/>

  <!-- warm rim light on right slopes -->
  <g stroke="#F5A34A" stroke-width="2" opacity=".35" fill="none">
    <path d="M1030 452 1000 490"/>
    <path d="M1260 492 1230 530"/>
    <path d="M1460 632 1432 668"/>
  </g>
</svg>
